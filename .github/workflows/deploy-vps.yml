name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Skip docker build (DB-only hotfix)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 45m
          script: |
            set -e
            PROJECT_DIR="${{ secrets.VPS_PROJECT_PATH || '/data/projects/Testictour_V2' }}"
            cd "$PROJECT_DIR"
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/deploy-vps.sh
            SKIP_BUILD=${{ github.event.inputs.skip_build == 'true' && '1' || '0' }} \
            SKIP_GIT_PULL=1 \
            ./scripts/deploy-vps.sh
