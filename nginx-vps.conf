# ========================================================
# NGINX CONFIGURATION FOR VPS DEPLOYMENT
# (TesTicTour & Grimoire Internal Networking)
# ========================================================
#
# CÁCH LÀM:
# 1. Chạy lệnh: docker network create vps-net
# 2. cd tft/grimoire && docker-compose up -d
# 3. cd TesTicTour_V2 && docker-compose up -d
# 4. Copy file này ném vào /etc/nginx/sites-available/testictour
# 5. sudo ln -s /etc/nginx/sites-available/testictour /etc/nginx/sites-enabled/
# 6. sudo nginx -t
# 7. sudo systemctl reload nginx
#
# Đừng quên sửa testictour.com thành domain thực tế của bạn.

# ========================================================
# CLOUDFLARE REAL IP CONFIGURATION
# ========================================================
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# CORS origins allowed for TesTicTour API responses generated by Nginx itself
# (for example body buffering/client body temp errors before Express receives the request).
map $http_origin $testictour_cors_origin {
    default "";
    "https://testictour.com" $http_origin;
    "https://www.testictour.com" $http_origin;
}

# ========================================================
# 1. CẤU HÌNH TESTICTOUR
# ========================================================

# Frontend của TesTicTour
server {
    listen 80;
    server_name testictour.com www.testictour.com; # Thay domain thực tế

    location / {
        proxy_pass http://127.0.0.1:3002;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Backend (API) của TesTicTour
server {
    listen 80;
    server_name api.testictour.com;

    # Cho phép upload file tối đa 50MB (mặc định Nginx chỉ 1MB)
    client_max_body_size 50M;

    # CORS fallback for Nginx-generated errors. Express still owns normal API CORS.
    add_header Access-Control-Allow-Origin $testictour_cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, Cookie" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Vary "Origin" always;

    # Tournament image uploads can otherwise fail inside Nginx body buffering
    # before Express sees the request, which surfaces in browsers as a CORS error.
    location ~ ^/api/tournaments/[^/]+/image$ {
        if ($request_method = OPTIONS) {
            return 204;
        }

        client_max_body_size 50M;
        proxy_request_buffering off;
        proxy_buffering off;

        proxy_pass http://127.0.0.1:4000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout fixes cho DevTools automation
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# ========================================================
# 2. CẤU HÌNH GRIMOIRE
# ========================================================

# Frontend của Grimoire
server {
    listen 80;
    server_name grimoire.testictour.com;  # Dùng subdomain của testictour.com

    location / {
        proxy_pass http://127.0.0.1:3000;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

# Backend (API) của Grimoire
server {
    listen 80;
    server_name api-grimoire.testictour.com;  # Đổi thành gạch nối để tránh lỗi SSL Cloudflare

    location / {
        proxy_pass http://127.0.0.1:3001;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        
        # SSE Streaming fixes
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
